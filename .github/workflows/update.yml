name: aktualizacja
on:
  schedule:
    - cron: '15 3 * * *' # codziennie ok. 5:15 czasu polskiego
  workflow_dispatch:
    inputs:
      dni:
        description: 'Ile dni wstecz przy pierwszym uruchomieniu'
        default: '30'
permissions:
  contents: write
concurrency: aktualizacja
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Warsaw # Chrome i skrypt w tej samej strefie; d2jsp pokazuje daty w strefie przeglądarki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save puppeteer-core@23
      - run: xvfb-run -a node scripts/update.mjs ${{ inputs.dni || 30 }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Dane: $(date -u +%F)"
          git push
