<!doctype html>
<!-- Odtwarzacz partii (straż, docs/straz_plan.md): ziarno, mody, właściciele łuków i wejścia z serwera (/partia), gra w trybie watch.
     Publicznie (link w alarmie Discord): https://kruszkush.github.io/d2jsp-licznik/lotnik/odtworz.html?gid=<gid>&srv=prod
     (test: …/d2jsp-licznik/test/lotnik/odtworz.html?…&srv=test); kopiuje scripts/publikuj.sh ze starą fizyką w lotnik/stare/.
     Lokalnie: python -m http.server 8800 → http://localhost:8800/out/odtworz.html?gid=<gid>&srv=prod|test
     (test: hasło testerów z localStorage „lotnik.haslo” tej strony albo z pola). Rekord widza w localStorage się nie zmienia.
     Partia ze starszej fizyki: sim_v{N}.js z serwer/stare/ (lokalnie) albo stare/ (po publikacji) jako watch.sim. -->
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotnik: odtwarzacz</title>
<style>
html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font:14px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:2;
  background:rgba(15,23,42,.85);padding:6px 10px;border-radius:10px}
#bar button{background:#334155;color:#e2e8f0;border:0;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
#bar button.on{background:#2563eb}
#msg{max-width:60vw}
.err{color:#fca5a5;font-weight:700}
.ok{color:#86efac;font-weight:700}
</style></head>
<body><canvas id="c"></canvas>
<div id="bar"><button id="x1" class="on">1×</button><button id="x2">2×</button><button id="x4">4×</button><button id="x8">8×</button><button id="again">Od nowa</button><span id="msg">Wczytywanie…</span></div>
<script type="module">
import { createGame, SIM_VER } from './game.js?v=71';
const STARE = location.pathname.includes('/out/') ? '../serwer/stare/' : './stare/';
const P = new URLSearchParams(location.search);
const gid = P.get('gid') || '';
const test = P.get('srv') === 'test';
// embed=1: okienko w rankingu gry (nakladka.js): start w 1× jak bez embed, bez tekstów technicznych i bez pytania o hasło, Esc zamyka okienko.
const embed = P.get('embed') === '1';
if (embed) addEventListener('keydown', (e) => { if (e.key === 'Escape') parent.postMessage({ lotnik: 'zamknij-nagranie' }, location.origin); });
const API = 'https://us-east1-rich-chimera-344319.cloudfunctions.net/' + (test ? 'lotnik-test' : 'lotnik');
const msg = document.getElementById('msg');
const say = (t, cls) => { msg.textContent = t; msg.className = cls || ''; };
let game = null, part = null, oldSim = null;

async function load() {
  const headers = { 'Content-Type': 'application/json' };
  let h = '';
  try { h = localStorage.getItem('lotnik.haslo') || ''; } catch (e) { /* bez zapisu */ }
  if (test && !h && !embed) h = prompt('Hasło testerów (lotnik-test):') || '';
  if (test && h) headers['X-Lotnik-Haslo'] = h;
  const r = await fetch(API + '/partia', { method: 'POST', headers, body: JSON.stringify({ gid }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'błąd ' + r.status);
  return j;
}

function play() {
  if (game) game.destroy();
  say(embed ? '' : `gid ${gid} · serwer: ${part.meters} m${part.usunieta ? ' · USUNIĘTA' : ''}`);
  game = createGame({
    canvas: document.getElementById('c'),
    nick: '',
    watch: { seed: part.seed, mods: part.mods, owners: part.owners, inputs: part.inputs, sim: oldSim },
    onEnd: (res) => {
      const same = Math.floor(res.meters) === Math.floor(part.meters);
      window.odtworzWynik = { meters: res.meters, server: part.meters, same };
      if (embed) say(`Koniec lotu: ${res.meters} m`, 'ok');
      else say(`koniec: ${res.meters} m, serwer ${part.meters} m · ${same ? 'zgodne' : 'NIEZGODNE'}`, same ? 'ok' : 'err');
    },
    onClose: () => {}
  });
  setSpeed(speed);
}

let speed = 1;
function setSpeed(k) {
  speed = k;
  if (game) game.setSpeed(k);
  for (const x of [1, 2, 4, 8]) document.getElementById('x' + x).className = k === x ? 'on' : '';
}
for (const x of [1, 2, 4, 8]) document.getElementById('x' + x).onclick = () => setSpeed(x);
setSpeed(speed);
document.getElementById('again').onclick = () => { if (part) play(); };

if (!/^[0-9a-f]{16}$/.test(gid)) say('Podaj ?gid=<16 znaków hex>&srv=prod|test', 'err');
else load().then(async (j) => {
  part = j;
  window.odtworzPartia = j;
  if (j.simVer !== SIM_VER) {
    try { oldSim = await import(STARE + 'sim_v' + j.simVer + '.js'); }
    catch (e) { throw new Error(`brak fizyki v${j.simVer} (strona ma v${SIM_VER})`); }
  }
  play();
}).catch((e) => say('Nie wczytano partii: ' + e.message, 'err'));
</script>
</body></html>
